name: Build & Push Container Images

on:
  push:
    branches:
      - main
      - feature/**
      - claude/**
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/magic-mirror

jobs:
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify no secrets in build context
        run: |
          cd frontend
          if ls *.pem *.key *.crt 2>/dev/null; then
            echo "::error::Certificates found in frontend build context"
            exit 1
          fi
          if ls .env* 2>/dev/null; then
            echo "::error::Environment files found in frontend build context"
            exit 1
          fi
          echo "Build context is clean"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: ./frontend
          file: ./frontend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build-frontend
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "=== Build Results ==="
          echo "Frontend: ${{ needs.build-frontend.result }}"

          if [ "${{ needs.build-frontend.result }}" = "failure" ]; then
            echo "::error::Frontend image build failed"
            exit 1
          fi
          echo "All builds passed or were skipped"
