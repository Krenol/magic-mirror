# Plain HTTP - used internally for k8s liveness/readiness probes. Not
# exposed externally; external HTTPS access uses the TLS server block below.
server {
  # Listen on port 3000 (unprivileged port for non-root user)
  listen 3000;

  # Server configuration
  root /var/www/frontend/html;
  index index.html;
  server_name frontend;

  # MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Disable server tokens for security
  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json;

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # SPA routing - serve index.html for all routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

# TLS - the app's only externally-exposed entrypoint now that oauth2-proxy
# (which previously terminated TLS in front of this container) is gone.
# Listens on an unprivileged high port; the k8s Service maps the real
# external port 443 to this one (see k8s/templates/frontend.yml.j2).
server {
  listen 8443 ssl;
  http2 on;

  root /var/www/frontend/html;
  index index.html;
  server_name frontend;

  ssl_certificate /opt/ssl/tls.crt;
  ssl_certificate_key /opt/ssl/tls.key;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json;

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}