---
- name: Read frontend TLS certificate
  ansible.builtin.slurp:
    src: "{{ certs_base_dir }}/frontend/ssl/{{ server_fqdn }}.pem"
  register: frontend_cert_pem_raw
  when: not (letsencrypt_enabled | default(false) | bool)

- name: Read frontend TLS key
  ansible.builtin.slurp:
    src: "{{ certs_base_dir }}/frontend/ssl/{{ server_fqdn }}.key"
  register: frontend_cert_key_raw
  when: not (letsencrypt_enabled | default(false) | bool)

- name: Set certificate facts (base64-encoded for k8s secrets)
  ansible.builtin.set_fact:
    oauth2_cert_pem: "{{ frontend_cert_pem_raw.content | default('') }}"
    oauth2_cert_key: "{{ frontend_cert_key_raw.content | default('') }}"
  no_log: true

- name: Create rendered manifests directory
  ansible.builtin.file:
    path: "{{ k8s_manifest_dir }}"
    state: directory
    mode: "0700"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"

- name: Render templated manifests (Jinja2)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ k8s_manifest_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: "0600"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  with_fileglob:
    - "{{ playbook_dir | dirname }}/k8s/templates/*.j2"
  no_log: true

- name: Copy static manifests
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ k8s_manifest_dir }}/{{ item | basename }}"
    mode: "0600"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  with_fileglob:
    - "{{ playbook_dir | dirname }}/k8s/templates/*.yml"

- name: Install Python kubernetes library
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
  become: true

- name: Deploy Kubernetes manifests
  block:
    - name: Apply namespace
      kubernetes.core.k8s:
        src: "{{ k8s_manifest_dir }}/namespace.yml"
        state: present
        kubeconfig: "{{ k8s_kubeconfig }}"

    - name: Apply secrets
      kubernetes.core.k8s:
        src: "{{ k8s_manifest_dir }}/secrets.yml"
        state: present
        kubeconfig: "{{ k8s_kubeconfig }}"
      no_log: true

    - name: Apply cert-manager resources (Let's Encrypt)
      kubernetes.core.k8s:
        src: "{{ k8s_manifest_dir }}/cert-manager.yml"
        state: present
        kubeconfig: "{{ k8s_kubeconfig }}"
      when: letsencrypt_enabled | default(false) | bool

    - name: Wait for Let's Encrypt certificate to be ready
      ansible.builtin.command: >-
        {{ kubectl_bin }} wait certificate/magic-mirror-tls
        -n magic-mirror --for=condition=Ready --timeout=300s
      changed_when: false
      when: letsencrypt_enabled | default(false) | bool

    - name: Apply workloads and services
      kubernetes.core.k8s:
        src: "{{ k8s_manifest_dir }}/frontend.yml"
        state: present
        kubeconfig: "{{ k8s_kubeconfig }}"

    - name: Wait for deployments to be ready
      ansible.builtin.command: >-
        {{ kubectl_bin }} rollout status deployment/frontend
        -n magic-mirror --timeout=300s
      changed_when: false

  always:
    - name: Clean up rendered manifests
      ansible.builtin.file:
        path: "{{ k8s_manifest_dir }}"
        state: absent
